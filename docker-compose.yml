services:
  context-engine:
    build:
      context: ./context-engine
    container_name: context-engine
    ports:
      - "8088:8088"
    environment:
      # Ollama — uses existing ollama instance
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
      - OLLAMA_REASON_MODEL=${OLLAMA_REASON_MODEL:-qwen3.5:9b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}

      # Repo + output
      - REPO_ROOT=/repos
      - OUTPUT_DIR=/output

      # Logging — LOG_FORMAT=json for structured output, text for human-readable
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - SLOW_REQUEST_MS=${SLOW_REQUEST_MS:-5000}

      # Scan limits — tuned for 8GB RAM / CPU-only inference
      - MAX_FILE_BYTES=${MAX_FILE_BYTES:-32768}
      - MAX_FILES_PER_SCAN=${MAX_FILES_PER_SCAN:-80}
      - MAX_SNIPPETS_PER_QUERY=${MAX_SNIPPETS_PER_QUERY:-20}

      # Supabase — uses internal Docker hostname on supabase network
      # Override in .env for local testing outside Docker
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase_kong_checkin-ascendvent:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_VECTOR_TABLE=${SUPABASE_VECTOR_TABLE:-code_embeddings}
      - SUPABASE_MATCH_FUNCTION=${SUPABASE_MATCH_FUNCTION:-match_code_embeddings}

    volumes:
      - ${HOME}/Repos:/repos:ro
      - ./ai-context:/output

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - supabase_net # reaches supabase_kong_checkin-ascendvent

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Attach to existing networks — do NOT create new ones
networks:
  supabase_net:
    external: true
    name: supabase_network_checkin-ascendvent
