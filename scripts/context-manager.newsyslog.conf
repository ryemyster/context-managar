# newsyslog config for context-manager launchd service
# Rotates at 10MB, keeps 5 compressed archives.
#
# Install:
#   sudo cp scripts/context-manager.newsyslog.conf /etc/newsyslog.d/context-manager.conf
#
# logfilename                                           owner:group      mode  count  size   when  flags
/Users/rmcdonald/Library/Logs/context-manager.log      rmcdonald:staff  640   5      10240  *     GZ
